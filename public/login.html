<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • Sistem Pelacakan Alumni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">Sistem Pelacakan Alumni</a>
    </div>
  </nav>

  <main class="container my-5" style="max-width: 520px;">
    <div id="alertArea"></div>

    <div class="card">
      <div class="card-body">
        <h4 class="mb-1">Login</h4>
        <p class="text-secondary mb-4">Masuk untuk mengakses sistem.</p>

        <div class="alert alert-info" role="alert">
          <div>ID: <code>rekayasa kebutuhan</code></div>
          <div>Password: <code>tugas4090</code></div>
        </div>

        <form id="loginForm" class="d-grid gap-3">
          <div>
            <label class="form-label">ID</label>
            <input name="id" class="form-control" placeholder="Masukkan ID" autocomplete="username" required />
          </div>
          <div>
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" placeholder="Masukkan password" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary" type="submit">Masuk</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
