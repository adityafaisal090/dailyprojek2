<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistem Pelacakan Alumni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">Sistem Pelacakan Alumni</a>
      <div class="ms-auto">
        <button id="btnLogout" class="btn btn-outline-secondary btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div id="alertArea"></div>

    <!-- Dashboard -->
    <section class="mb-4">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <h4 class="mb-0">Dashboard</h4>
        <button id="btnRefresh" class="btn btn-outline-secondary btn-sm">Refresh</button>
      </div>
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <div class="card">
            <div class="card-body">
              <div class="text-secondary">Total Alumni</div>
              <div id="totalAlumni" class="display-6">0</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="card">
            <div class="card-body">
              <div class="text-secondary">Pelacakan Terakhir</div>
              <div id="lastTracking" class="fs-5">-</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Form tambah alumni -->
    <section class="mb-4">
      <h4>Form Tambah Alumni</h4>
      <form id="alumniForm" class="card card-body">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Nama</label>
            <input name="nama" class="form-control" placeholder="Nama alumni" required />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">NIM (opsional)</label>
            <input name="nim" class="form-control" placeholder="NIM" />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Jurusan</label>
            <input name="jurusan" class="form-control" placeholder="Jurusan" required />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Tahun Lulus</label>
            <input name="tahunLulus" type="number" class="form-control" placeholder="2024" required />
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Tambah Alumni</button>
            <button class="btn btn-outline-secondary" type="reset">Reset</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Hasil pelacakan -->
    <section class="mb-4">
      <h4>Hasil Pelacakan</h4>
      <div id="trackingCard" class="card">
        <div class="card-body">
          <div class="text-secondary">Klik tombol "Lacak Alumni" pada tabel.</div>
        </div>
      </div>
    </section>

    <!-- Tabel data alumni -->
    <section class="mb-4">
      <div class="d-flex align-items-center justify-content-between">
        <h4 class="mb-0">Tabel Data Alumni</h4>
        <input id="searchInput" class="form-control form-control-sm w-auto" placeholder="Cari nama/jurusan..." />
      </div>
      <div class="table-responsive mt-2">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Jurusan</th>
              <th>Tahun</th>
              <th style="width: 160px">Aksi</th>
            </tr>
          </thead>
          <tbody id="alumniTableBody">
            <tr><td colspan="4" class="text-center text-secondary">Memuat...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
