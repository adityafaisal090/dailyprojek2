services:
  - type: web
    name: dailyprojek2
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: alumni-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
